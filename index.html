<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Рабочий вес</title>
  <meta name="description" content="Журнал весов на тренажёрах и календарь тренировок">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Рабочий вес">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#EEF0F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/fsec-cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="Разделы">
      <button class="tab" type="button" data-tab="machines" id="tab-machines">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="3.2" rx="1"/><rect x="6" y="7.6" width="12" height="3.2" rx="1"/><rect x="6" y="12.2" width="12" height="3.2" rx="1"/><rect x="6" y="16.8" width="12" height="3.2" rx="1"/><path d="M3 13.8h15.5" class="pin"/></svg>
        <span>Тренажёры</span>
      </button>
      <button class="tab" type="button" data-tab="calendar" id="tab-calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" class="outline"/><path d="M3.5 9.5h17M8 3v4M16 3v4" class="outline"/><circle cx="9" cy="14.5" r="1.6"/><circle cx="15" cy="14.5" r="1.6"/></svg>
        <span>Календарь</span>
      </button>
      <button class="tab" type="button" data-tab="data" id="tab-data">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="2.8" class="outline"/><path d="M4.5 6v12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8" class="outline"/></svg>
        <span>Данные</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
